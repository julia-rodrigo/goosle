<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Goosle</title>
  <link rel="stylesheet" href="../shared/ui.css" />
  <style>
    body { width: 340px; padding: 14px 16px 16px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    header h1 { font-size: 17px; display: flex; align-items: center; gap: 8px; }
    header img { width: 22px; height: 22px; }
    section { margin-top: 14px; }
    section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
    .focus { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .focus p { margin-bottom: 8px; }
    .usage-row { display: grid; grid-template-columns: 80px 1fr 56px; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0; }
    .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); }
    .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    footer { display: flex; gap: 8px; margin-top: 14px; }
    footer .btn { flex: 1; }
    .off { opacity: .45; pointer-events: none; }
    select { width: 100%; }
  </style>
</head>
<body>
  <header>
    <h1><img src="../../icons/32.png" alt="" /> Goosle</h1>
    <label class="switch" title="Turn Goosle on or off"><input type="checkbox" id="enabled" aria-label="Goosle on" /><span></span></label>
  </header>

  <div id="main">
    <section>
      <h2>This week's focus</h2>
      <div class="focus">
        <p id="focus-text" class="muted"></p>
        <div id="focus-chips" class="chips"></div>
      </div>
    </section>

    <section>
      <h2>Show me</h2>
      <select id="mode" aria-label="What to show"></select>
    </section>

    <section>
      <h2>Quick switches</h2>
      <div id="toggles"></div>
    </section>

    <section>
      <h2>Today</h2>
      <div id="usage"></div>
    </section>
  </div>

  <footer>
    <button class="btn" id="break">Take a break now</button>
    <button class="btn primary" id="settings">All settings</button>
  </footer>

  <script src="../shared/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
